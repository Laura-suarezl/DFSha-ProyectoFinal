# Clúster de etcd de 3 miembros para el prototipo de la etapa 4 (mismo tamaño que en AWS, D1).
# Uso:  docker compose -f prototipos/etcd-cluster/docker-compose.yml up -d
# Clientes desde el equipo anfitrión:  ipv4:127.0.0.1:23791,127.0.0.1:23792,127.0.0.1:23793

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.35
  restart: "no"

x-flags: &flags
  ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_INITIAL_CLUSTER_TOKEN: dfsha-prototipo
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_DATA_DIR: /etcd-data
  ETCD_AUTO_COMPACTION_MODE: periodic
  ETCD_AUTO_COMPACTION_RETENTION: 1h

services:
  etcd1:
    <<: *etcd
    container_name: dfsha-proto-etcd1
    ports: ["23791:2379"]
    environment:
      <<: *flags
      ETCD_NAME: etcd1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379

  etcd2:
    <<: *etcd
    container_name: dfsha-proto-etcd2
    ports: ["23792:2379"]
    environment:
      <<: *flags
      ETCD_NAME: etcd2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379

  etcd3:
    <<: *etcd
    container_name: dfsha-proto-etcd3
    ports: ["23793:2379"]
    environment:
      <<: *flags
      ETCD_NAME: etcd3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379

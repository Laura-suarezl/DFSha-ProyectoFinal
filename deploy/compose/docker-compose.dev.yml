# Entorno local de desarrollo de DFSha (solo para desarrollar en un computador, no es el despliegue).
# Ver deploy/compose/README.md. El despliegue real es en AWS con un Compose por máquina (D10).
#
# Antes de levantarlo, se crean una vez los certificados de prueba y la clave maestra local con
#   python deploy/certs/crear_certificados.py --local
#   python -m dfsha.metadata crear-clave-local deploy/certs/out/kek-dev.bin
# Para levantar, probar y bajar el entorno
#   docker compose -f deploy/compose/docker-compose.dev.yml up -d --build
#   python deploy/compose/prueba_humo.py
#   docker compose -f deploy/compose/docker-compose.dev.yml down -v
#
# Dentro de la red "dfsha" cada contenedor responde a su nombre de AWS (dn1.dfsha.internal, ...),
# así los certificados se validan igual que en producción. Desde el equipo anfitrión solo se
# publican los puertos de clientes, 51041 a 51043 para los nodos de metadatos y 51052 a 51055 para
# los de datos. Los puertos internos solo existen dentro de la red, como los cerrarán los grupos
# de seguridad en AWS.
#
# Cada nodo de metadatos comparte la red de su miembro de etcd (network_mode), igual que en AWS,
# donde los dos corren en la misma máquina. Por eso los nombres mdsN.dfsha.internal y
# dfsha.internal están en los servicios de etcd. etcd usa TLS mutuo con el certificado de su máquina
# (mdsN), tanto con los clientes como entre miembros.

name: dfsha-dev

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.35
  networks: [dfsha]
  volumes:
    - ../certs/out:/certs:ro

x-etcd-entorno: &etcd-entorno
  ETCD_INITIAL_CLUSTER: etcd1=https://mds1.dfsha.internal:2380,etcd2=https://mds2.dfsha.internal:2380,etcd3=https://mds3.dfsha.internal:2380
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_INITIAL_CLUSTER_TOKEN: dfsha-dev
  ETCD_LISTEN_PEER_URLS: https://0.0.0.0:2380
  ETCD_LISTEN_CLIENT_URLS: https://0.0.0.0:2379
  ETCD_CLIENT_CERT_AUTH: "true"
  ETCD_PEER_CLIENT_CERT_AUTH: "true"
  ETCD_TRUSTED_CA_FILE: /certs/ca.crt
  ETCD_PEER_TRUSTED_CA_FILE: /certs/ca.crt
  ETCD_DATA_DIR: /etcd-data
  ETCD_AUTO_COMPACTION_MODE: periodic
  ETCD_AUTO_COMPACTION_RETENTION: 1h

x-nodo-de-datos: &nodo-de-datos
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  image: dfsha:dev
  command: ["python", "-m", "dfsha.datanode"]
  volumes:
    - ../certs/out:/etc/dfsha/certs:ro

x-metadatos: &metadatos
  image: dfsha:dev                     # la construye el servicio de los nodos de datos
  pull_policy: never
  command: ["python", "-m", "dfsha.metadata"]
  volumes:
    - ../certs/out:/etc/dfsha/certs:ro

x-metadatos-entorno: &metadatos-entorno
  DFSHA_TLS_HABILITADO: "true"
  DFSHA_TLS_CA: /etc/dfsha/certs/ca.crt
  DFSHA_ETCD_DESTINO: dns:///dfsha.internal:2379
  DFSHA_ETCD_TLS: "true"
  DFSHA_KMS_CLAVE: archivo:/etc/dfsha/certs/kek-dev.bin

x-nodo-entorno: &nodo-entorno
  DFSHA_TLS_HABILITADO: "true"
  DFSHA_TLS_CA: /etc/dfsha/certs/ca.crt
  DFSHA_NODO_DIRECTORIO_DATOS: /var/lib/dfsha

services:
  etcd1:
    <<: *etcd
    networks: {dfsha: {aliases: [dfsha.internal, mds1.dfsha.internal]}}
    ports: ["127.0.0.1:51041:50051"]
    environment:
      <<: *etcd-entorno
      ETCD_NAME: etcd1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://mds1.dfsha.internal:2380
      ETCD_ADVERTISE_CLIENT_URLS: https://mds1.dfsha.internal:2379
      ETCD_CERT_FILE: /certs/mds1.crt
      ETCD_KEY_FILE: /certs/mds1.key
      ETCD_PEER_CERT_FILE: /certs/mds1.crt
      ETCD_PEER_KEY_FILE: /certs/mds1.key
  etcd2:
    <<: *etcd
    networks: {dfsha: {aliases: [dfsha.internal, mds2.dfsha.internal]}}
    ports: ["127.0.0.1:51042:50051"]
    environment:
      <<: *etcd-entorno
      ETCD_NAME: etcd2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://mds2.dfsha.internal:2380
      ETCD_ADVERTISE_CLIENT_URLS: https://mds2.dfsha.internal:2379
      ETCD_CERT_FILE: /certs/mds2.crt
      ETCD_KEY_FILE: /certs/mds2.key
      ETCD_PEER_CERT_FILE: /certs/mds2.crt
      ETCD_PEER_KEY_FILE: /certs/mds2.key
  etcd3:
    <<: *etcd
    networks: {dfsha: {aliases: [dfsha.internal, mds3.dfsha.internal]}}
    ports: ["127.0.0.1:51043:50051"]
    environment:
      <<: *etcd-entorno
      ETCD_NAME: etcd3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://mds3.dfsha.internal:2380
      ETCD_ADVERTISE_CLIENT_URLS: https://mds3.dfsha.internal:2379
      ETCD_CERT_FILE: /certs/mds3.crt
      ETCD_KEY_FILE: /certs/mds3.key
      ETCD_PEER_CERT_FILE: /certs/mds3.crt
      ETCD_PEER_KEY_FILE: /certs/mds3.key

  mds1:
    <<: *metadatos
    network_mode: "service:etcd1"
    depends_on: {etcd1: {condition: service_started, restart: true}}
    environment:
      <<: *metadatos-entorno
      DFSHA_NODO_NOMBRE: mds1.dfsha.internal
      DFSHA_TLS_CERTIFICADO: /etc/dfsha/certs/mds1.crt
      DFSHA_TLS_LLAVE: /etc/dfsha/certs/mds1.key
  mds2:
    <<: *metadatos
    network_mode: "service:etcd2"
    depends_on: {etcd2: {condition: service_started, restart: true}}
    environment:
      <<: *metadatos-entorno
      DFSHA_NODO_NOMBRE: mds2.dfsha.internal
      DFSHA_TLS_CERTIFICADO: /etc/dfsha/certs/mds2.crt
      DFSHA_TLS_LLAVE: /etc/dfsha/certs/mds2.key
  mds3:
    <<: *metadatos
    network_mode: "service:etcd3"
    depends_on: {etcd3: {condition: service_started, restart: true}}
    environment:
      <<: *metadatos-entorno
      DFSHA_NODO_NOMBRE: mds3.dfsha.internal
      DFSHA_TLS_CERTIFICADO: /etc/dfsha/certs/mds3.crt
      DFSHA_TLS_LLAVE: /etc/dfsha/certs/mds3.key

  dn1:
    <<: *nodo-de-datos
    networks: {dfsha: {aliases: [dn1.dfsha.internal]}}
    ports: ["127.0.0.1:51052:50052"]
    volumes: [../certs/out:/etc/dfsha/certs:ro, datos-dn1:/var/lib/dfsha]
    environment:
      <<: *nodo-entorno
      DFSHA_NODO_NOMBRE: dn1.dfsha.internal
      DFSHA_NODO_ZONA: local-a
      DFSHA_TLS_CERTIFICADO: /etc/dfsha/certs/dn1.crt
      DFSHA_TLS_LLAVE: /etc/dfsha/certs/dn1.key
  dn2:
    <<: *nodo-de-datos
    networks: {dfsha: {aliases: [dn2.dfsha.internal]}}
    ports: ["127.0.0.1:51053:50052"]
    volumes: [../certs/out:/etc/dfsha/certs:ro, datos-dn2:/var/lib/dfsha]
    environment:
      <<: *nodo-entorno
      DFSHA_NODO_NOMBRE: dn2.dfsha.internal
      DFSHA_NODO_ZONA: local-b
      DFSHA_TLS_CERTIFICADO: /etc/dfsha/certs/dn2.crt
      DFSHA_TLS_LLAVE: /etc/dfsha/certs/dn2.key
  dn3:
    <<: *nodo-de-datos
    networks: {dfsha: {aliases: [dn3.dfsha.internal]}}
    ports: ["127.0.0.1:51054:50052"]
    volumes: [../certs/out:/etc/dfsha/certs:ro, datos-dn3:/var/lib/dfsha]
    environment:
      <<: *nodo-entorno
      DFSHA_NODO_NOMBRE: dn3.dfsha.internal
      DFSHA_NODO_ZONA: local-b
      DFSHA_TLS_CERTIFICADO: /etc/dfsha/certs/dn3.crt
      DFSHA_TLS_LLAVE: /etc/dfsha/certs/dn3.key
  dn4:
    <<: *nodo-de-datos
    networks: {dfsha: {aliases: [dn4.dfsha.internal]}}
    ports: ["127.0.0.1:51055:50052"]
    volumes: [../certs/out:/etc/dfsha/certs:ro, datos-dn4:/var/lib/dfsha]
    environment:
      <<: *nodo-entorno
      DFSHA_NODO_NOMBRE: dn4.dfsha.internal
      DFSHA_NODO_ZONA: local-c
      DFSHA_TLS_CERTIFICADO: /etc/dfsha/certs/dn4.crt
      DFSHA_TLS_LLAVE: /etc/dfsha/certs/dn4.key

  # Máquina cliente: la CLI dentro de la red, como en la EC2 cliente de AWS.
  #   docker compose -f deploy/compose/docker-compose.dev.yml exec cliente dfsha login admin
  cliente:
    image: dfsha:dev
    pull_policy: never
    command: ["sleep", "infinity"]
    networks: [dfsha]
    volumes: [../certs/out/ca.crt:/etc/dfsha/certs/ca.crt:ro]
    environment:
      DFSHA_TLS_CA: /etc/dfsha/certs/ca.crt
      DFSHA_SESION: /tmp/dfsha-sesion.json

networks:
  dfsha:

volumes:
  datos-dn1:
  datos-dn2:
  datos-dn3:
  datos-dn4:
